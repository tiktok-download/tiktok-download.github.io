<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频数据提取 API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .description {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-content {
            background: white;
            padding: 12px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }
        .error.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 视频数据提取 API</h1>
        <p class="description">
            这是一个演示程序，展示了如何使用视频提取API。
            该系统通过获取验证令牌，进行加密解密处理，最终向服务器请求视频数据。
        </p>

        <div class="form-group">
            <label for="videoUrl">视频URL (可选)</label>
            <input type="text" id="videoUrl" placeholder="例如: https://www.tiktok.com/video/123456" 
                   value="https://www.tiktok.com/video/7123456789012345678">
        </div>

        <button onclick="handleExtractVideo()">🚀 开始提取视频数据</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理中...</p>
        </div>

        <div class="error" id="errorBox"></div>

        <div class="result" id="result">
            <h3>✓ 执行结果</h3>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <script>
        /**
         * 主入口函数：提取视频数据
         * 流程：
         * 1. 获取验证令牌
         * 2. 调用API获取视频信息
         * 3. 处理并返回结果
         */
        async function extractVideoData(videoUrl) {
            try {
                // 步骤1：获取验证令牌，验证请求
                console.log('📍 步骤1：正在获取验证令牌...');
                const verificationString = await getVerificationToken();
                console.log('✓ 令牌处理完成');

                // 步骤2：调用API获取视频数据
                console.log('📍 步骤2：正在请求API...');
                const response = await fetch("https://snaptik.app/api/extract?url=" + encodeURIComponent(videoUrl), {
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-Verify": verificationString
                    }
                });

                // 步骤3：处理服务器响应
                console.log('📍 步骤3：处理服务器响应...');
                if (!response.ok) {
                    const statusCode = response.status;
                    const contentType = response.headers.get("content-type") || "";

                    if (contentType.indexOf("application/json") !== -1) {
                        const errorData = await response.json();
                        const error = new Error(errorData.error || "服务器错误 " + statusCode);
                        error.status = statusCode;
                        throw error;
                    }

                    const error = new Error("服务器错误 " + statusCode);
                    error.status = statusCode;
                    throw error;
                }

                const videoData = await response.json();
                console.log('✓ 数据获取成功');
                return videoData;

            } catch (error) {
                console.error('❌ 错误:', error);
                throw error;
            }
        }

        /**
         * 获取验证令牌
         * 流程：
         * 1. 向服务器请求token
         * 2. 处理token数据并进行加密验证
         * 3. 返回最终的验证字符串
         */
        async function getVerificationToken() {
            try {
                // 请求服务器获取token和随机数据
                const tokenResponse = await fetch("https://snaptik.app/api/token", {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "Content-Type": "application/json"
                    }
                });

                const tokenData = await tokenResponse.json();
                console.log('🔐 收到token数据:', {
                    id: tokenData.id,
                    encodedData: tokenData.p ? tokenData.p.substring(0, 20) + '...' : 'N/A'
                });

                // 处理token并生成验证字符串
                return await processTokenAndVerify(tokenData.id, tokenData.p);

            } catch (error) {
                console.error('获取令牌失败:', error);
                throw error;
            }
        }

        /**
         * 处理Token并生成验证字符串
         * 流程：
         * 1. 解密Token数据
         * 2. 提取并处理其中的关键信息
         * 3. 生成最终的验证字符串
         */
        async function processTokenAndVerify(tokenId, encodedData) {
            try {
                // 解密token数据
                const decryptedJson = await decryptTokenData(tokenId, encodedData);
                const parsedData = JSON.parse(decryptedJson);

                // 从解密数据中提取关键信息
                const encryptionKey = parsedData._e;
                const hashValue = parsedData._h;

                // 移除这两个字段，保留其他数据
                delete parsedData._e;
                delete parsedData._h;

                // 对剩余数据进行哈希处理
                const dataHash = hashObject(parsedData);

                // 组合成最终的验证字符串：tokenId:dataHash:encryptionKey:hashValue
                const verificationString = tokenId + ":" + dataHash + ":" + encryptionKey + ":" + hashValue;
                console.log('✓ 验证字符串生成成功');

                return verificationString;

            } catch (error) {
                console.error('处理Token失败:', error);
                throw error;
            }
        }

        /**
         * 解密Token数据
         * 使用AES-CBC算法进行解密
         * 流程：
         * 1. 解码base64格式的数据
         * 2. 分离出IV(初始向量)和加密数据
         * 3. 生成解密密钥
         * 4. 执行AES-CBC解密
         * 5. 解码为文本
         */
        async function decryptTokenData(tokenId, encodedData) {
            try {
                // 解码base64字符串
                const decodedData = atob(encodedData);
                const byteArray = new Uint8Array(decodedData.length);

                for (let i = 0; i < decodedData.length; i++) {
                    byteArray[i] = decodedData.charCodeAt(i);
                }

                // 分离IV和加密数据
                // IV通常是前16字节（128位）
                const initializationVector = byteArray.slice(0, 16);
                const encryptedData = byteArray.slice(16);

                // 生成解密密钥
                const saltOrDeviceId = getSaltOrDeviceId();
                const keyMaterial = saltOrDeviceId + ":" + tokenId;
                const derivedKey = await computeSHA256Hash(keyMaterial);

                // 导入密钥用于AES-CBC解密
                const cryptoKey = await crypto.subtle.importKey(
                    "raw",
                    derivedKey,
                    { name: "AES-CBC" },
                    false,
                    ["decrypt"]
                );

                // 执行解密
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: initializationVector },
                    cryptoKey,
                    encryptedData
                );

                // 将解密结果转换为文本
                const decryptedText = new TextDecoder().decode(decryptedBuffer);
                console.log('✓ 数据解密成功');

                return decryptedText;

            } catch (error) {
                console.error('解密失败:', error);
                throw error;
            }
        }

        /**
         * 计算SHA-256哈希值
         */
        async function computeSHA256Hash(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            return await crypto.subtle.digest("SHA-256", data);
        }

        /**
         * 获取设备ID或盐值
         * (这是一个占位符实现，实际值应由系统提供)
         */
        function getSaltOrDeviceId() {
            // 可以返回设备ID、浏览器指纹或固定的盐值
            return "default_device_salt";
        }

        /**
         * 对对象进行哈希处理
         * (这是一个占位符实现，具体算法取决于业务需求)
         */
        function hashObject(obj) {
            // 简单实现：序列化对象并进行简单处理
            const jsonString = JSON.stringify(obj);
            let hash = 0;
            for (let i = 0; i < jsonString.length; i++) {
                const char = jsonString.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash).toString(16);
        }

        /**
         * 页面事件处理函数
         */
        async function handleExtractVideo() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultBox = document.getElementById('result');
            const loadingBox = document.getElementById('loading');

            // 清空之前的结果和错误
            errorBox.classList.remove('show');
            resultBox.classList.remove('show');
            loadingBox.classList.add('show');

            try {
                if (!videoUrl) {
                    throw new Error('请输入视频URL');
                }

                console.log('🎬 开始提取视频:', videoUrl);
                const result = await extractVideoData(videoUrl);

                // 显示结果
                loadingBox.classList.remove('show');
                document.getElementById('resultContent').textContent = JSON.stringify(result, null, 2);
                resultBox.classList.add('show');

                console.log('🎉 全部完成！');

            } catch (error) {
                loadingBox.classList.remove('show');
                errorBox.classList.add('show');
                errorBox.textContent = '❌ 错误: ' + (error.message || error);
                console.error('操作失败:', error);
            }
        }

        // 页面加载时的提示
        window.addEventListener('load', () => {
            console.log('%c=== 视频提取API演示 ===', 'color: #667eea; font-size: 16px; font-weight: bold;');
            console.log('%c函数映射关系:', 'color: #764ba2; font-weight: bold;');
            console.log('提取视频数据 → extractVideoData()');
            console.log('获取验证令牌 → getVerificationToken()');
            console.log('处理令牌验证 → processTokenAndVerify()');
            console.log('解密令牌数据 → decryptTokenData()');
            console.log('计算SHA256哈希 → computeSHA256Hash()');
            console.log('获取设备ID/盐值 → getSaltOrDeviceId()');
            console.log('对象哈希处理 → hashObject()');
        });
    </script>
</body>
</html>
